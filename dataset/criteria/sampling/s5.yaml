# 표본 기준 - S5 CDJ 단계
# 출처: 학습데이터·골든셋 구축 방안 - S5 CDJ 단계 (2026.11.06)
#   https://docs.google.com/document/d/1-cuM7QwLERE8usUZYxH6Fomov4vjuVNL8LfFaFqH8Uo/edit
# 공통 값은 common.yaml. 라벨 기준은 ../s5.md

prerequisites:
  - S4 브랜드·논브랜드 구분이 정확한 키워드만. 틀린 구분은 고쳐서 넣음 (라벨링 전에 확정)
  - target·intent·site가 S3 추출 기준(구축 방안 부록 2)대로 뽑힌 키워드만

labels:
  brand: [browsing, experience, confirmation, own_and_service, other]
  nonbrand: [initial_exploration, own_and_service, other]
label_quota: equal                 # 단계별 몫 균등
brand_ratio: {target: 0.5, tolerance: 0.1}

intent_max_share_in_stage: 0.2     # 한 의도 키워드가 단계 몫의 20% 이하
same_target_per_partition: 1       # 같은 브랜드·제품은 파티션마다 1회 (디시·쿠팡 같은 site는 반복 허용)
other_fill: Gemma 판정과 상관없이 Other 의도(뜻·주식·채용 등)가 있는 키워드로 채움. 증권 카테고리의 주식·배당은 제외. test·development는 뜻에 몰려 20% 상한 예외
region_keywords: 판단은 기준표대로, 표본에는 많이 넣지 않음
record_matched_intent: true        # 레코드마다 맞은 의도 키워드·의도 묶음을 남김

hard_case_types:
  - 규칙을 적용해야 답이 나옴 (후기 가격, 가격 비교, 에코백스 수리 가격)
  - 카테고리와 연결해야 보임 (첫만남 어색 - 소개팅앱, 강아지 눈물자국 없애기)
  - 브랜드인지 카테고리인지 바로 안 보임 (스티바 a, 고배기량)
deferred_hard_types:
  - Own & Service 단서와 구매 전 단서가 같이 온 키워드 (다음 구축부터 넣음)

exclude:
  - target·intent·site가 잘못 뽑힌 키워드
  - 주소·전화번호·우편번호
  - 뜻을 알 수 없는 문자열, 오타만 있는 키워드
  - 날짜·숫자만 다른 반복 키워드는 1개만 (예: 4월 13일 캐시워크 정답)
  - 이미 뽑힌 키워드와 날짜·숫자를 뺀 target+intent가 같은 키워드
