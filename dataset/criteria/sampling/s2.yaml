# 표본 기준 - S2 Span 유무관 유형
# 출처: 학습데이터·골든셋 구축 방안 - S2 Span 유무관 유형 (2026.11.09)
#   https://docs.google.com/document/d/1EMPjiprPBBQ2rpbEJXpNTbm9c-aciOtWhWXm8Gr-rgQ/edit
# 공통 값은 common.yaml. 라벨 기준은 ../s2.md

prerequisites:
  - S1에서 걸러져야 할 노이즈 키워드(띄어쓰기 오류·너무 긴 검색어·언어 섞임)는 넣지 않음
  - S2 칸은 모두 Span 트랙으로 채움. CEP 트랙은 이번 데이터에서 제외
partition: S5에서 고정한 산업군·카테고리 파티션 그대로. 같은 키워드는 한 파티션에만, S4·S5에 있는 키워드는 그 파티션을 따름

labels: [0, 1, 2, 3, 4, 5, 6, 7]   # 0 유관 / 1 다른 카테고리 / 2 같은 이름 다른 카테고리 / 3 채용 / 4 주식·금융 / 5 뉴스·홍보 / 6 특정 인물 / 7 기타 무관
label_quota:
  unrelated_each: 0.10             # 무관 유형(1~7)마다 칸의 10%
  related: rest                    # 유관(0)은 나머지 (약 30%)
related_mix: S5 여정 5단계(initial·browsing·experience·confirmation·own & service) 균등. S5 Other 키워드는 유관으로 넣지 않고 다시 판정. 브랜드 비율은 맞추지 않음
short_type_fill: 모자란 유형은 후보를 더 모아 다시 판정, 그래도 모자라면 유형 1로 채운 뒤 건수 기록

category_max_share: 0.05           # 카테고리를 돌아가며 하나씩 뽑고, 한 카테고리가 칸의 5% 이하
same_target_per_cell: 1            # 같은 target은 칸에 한 번
same_brand_or_seed_per_cell: 20    # 같은 브랜드·시드 단어는 칸 안 20건 이내
industry_max_share_in_type: 0.3    # 한 무관 유형 안에서 한 산업군 30% 이하
address_noise_max_share_in_type7: 0.2
train_without_reason_text: [1, 2, 7]   # 사유 글은 학습하지 않고 번호만

hard_case_types:
  - 1·2 경계 (capital one 360 checking - 신용카드)
  - 무관처럼 보이는 유관 (식기세척기 린스, 目黒蓮 コーヒーメーカー, シロカとは)
  - S5 예외 규칙 적용 (증권 카테고리의 주가, 교육 카테고리의 취업)
  - 뉴스와 제품 정보 경계
  - 낯선 이름 (SERP로 확인해야 유형이 정해짐)
  - 상황·문제 키워드 (離れ乳 改善サロン - 브라, 紫外線 対策 - 선케어)
  - 다른 용도 (치약으로 바퀴벌레 잡기, ドライヤーでダニ退治)
  - 작은 브랜드·낯선 카테고리 (잘때꼭바르는크림, Joint Food)

failure_kinds:                     # dev·test에만, 한 종류가 칸 오답의 절반 이하
  - 이름·단어의 뜻 (유관 → 7)
  - 카테고리 대상을 묻는 とは·~란·what is, 리필·교체 (무관 → 0)
  - 상황·문제, 다른 용도 (무관 → 0)
  - 회사·브랜드 논란·소송 (유관 → 5)
  - 무관 유형 혼동

exclude:
  - 여러 파티션의 카테고리에 동시에 나오는 키워드
  - S2 판정 오류(error)가 난 키워드, hbase에 SERP가 없는 키워드
  - 날짜·숫자만 다른 반복 키워드는 1개만
  - 시드 그대로 통과한 키워드, CEP 트랙 키워드
  - 제품 코드만 있는 키워드 (띄어쓰기 없이 영문·숫자로만 된 5자 이상, 숫자 3개 이상. 예: adq74213205, rtx2060)
