# 미사용: 실험에 쓰지 않은 모델입니다(2026-11-25 기준). 설정만 남겨 둡니다. 실험 모델은 train/README.md의 '모델' 표.
# Kev-9B (jaredpalmer/kev). Values follow the experiment design document.
name: kev-9b
backend: kev
checkpoint: jaredpalmer/kev-9b@v1.0
base: Qwen/Qwen3.5-9B-Base
base_revision: null        # fill from the checkpoint's training_config.json
multilingual: true

train:
  lora_rank: 16
  head_dim: 256
  lora_targets: all
  lr: 2.0e-5
  epochs: 1
  batch: 2
  accum: 4
  checkpointing: 1
  weights_dtype: fp32      # set bf16 if the whole study runs on g6e.xlarge
  dtype: bf16
  p_none_pair: 0.25
  max_state: 2048           # state tokens per training record (Kev default 384 drops long ko/ja SERPs); = Laya max_len.
                            # Same data for every model: training stops if Kev still drops any record.
  extra_args: ["--option_isolation", "0", "--special_embeddings", "0"]

kev_repo: https://github.com/jaredpalmer/kev.git
kev_ref: kev-1.0
instance: ml.g7e.2xlarge   # confirm with the smoke run's peak memory

# Serving profile (scripts/run.py --serving, configs/serving.yaml): kev.serve's own CUDA defaults instead of the
# fp32 evaluation path: bf16, CUDA graphs and the fused Qwen3.5 kernels. The kernels need flash-linear-attention
# at kev's FLA_VERSION (kev/fused_qwen35.py), which the serve extra does not install; KEV_FUSED=1 fails loudly
# without it instead of quietly serving unfused.
serving:
  env: {KEV_DTYPE: bf16, KEV_CUDA_GRAPHS: "1", KEV_FUSED: "1"}
  install: ["flash-linear-attention==0.5.2"]
