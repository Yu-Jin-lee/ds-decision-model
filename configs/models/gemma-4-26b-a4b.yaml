# Gemma 4 26B-A4B instruct (google/gemma-4-26B-A4B-it), used as is: no fine-tuning.
# Reference baseline: the generative model the team uses today, measured on the same
# data and instance as the decision models. It generates text with the production prompts
# below and the leading number is parsed to a label (level `prompt`, groups P0-s2/s4/s5).
# Reported: accuracy, invalid-output rate, latency. No probabilities, so no Brier/ECE/auto rate.
name: gemma-4-26b-a4b
backend: prompt_llm
checkpoint: google/gemma-4-26B-A4B-it
multilingual: true
trainable: false

# vLLM server, same flags as the team's gpu02 deployment where they apply to one GPU.
# bf16 weights need 80 GB; int8 weight-only (bf16 compute) fits the 48 GB L40S.
vllm:
  package: vllm               # newest release at install time; the version is recorded in summary.json
  args: [--dtype, bfloat16, --quantization, int8_per_channel_weight_only,
         --max-model-len, "12288", --max-num-batched-tokens, "4096", --max-num-seqs, "96",
         --gpu-memory-utilization, "0.95", --enable-prefix-caching, --async-scheduling,
         --limit-mm-per-prompt, '{"image":0,"video":0,"audio":0}']
  max_tokens: 64              # answers are one line ("2", "1|samsung", "7|history")
  eval_concurrency: 16        # parallel requests for scoring; latency is still timed one request at a time

# Production prompts (configs/prompts/gemma-4/<file>_<lang>.txt) and how the leading
# number of the generated answer maps to this repo's labels.
prompt_dir: configs/prompts/gemma-4
lang_suffix: {ko: kr, ja: jp, en: us}
prompts:
  s5:
    brand:
      file: s5_cdj_brand
      digits: {"1": browsing, "2": experience, "3": confirmation, "4": own_and_service, "5": other}
    nonbrand:
      file: s5_cdj_generic
      digits: {"1": initial_exploration, "2": own_and_service, "3": other}
  s4:
    file: s4_brand_generic
    digits: {"1": brand, "0": nonbrand}
  s2:
    file: s2_span
    digits: {"0": related, "1": other_category, "2": same_name_other_category, "3": hiring,
             "4": stock_finance, "5": news_pr, "6": person, "7": other_unrelated}

instance: ml.g6e.xlarge
volume_gb: 150             # ~52 GB of bf16 weights in the HF cache plus the vLLM venv
